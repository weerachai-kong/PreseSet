services:
  postgres:
    image: postgres:16-alpine
    container_name: paceset-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: paceset
      POSTGRES_PASSWORD: paceset
      POSTGRES_DB: paceset
    volumes:
      - paceset_pg_data:/var/lib/postgresql/data

volumes:
  paceset_pg_data:
